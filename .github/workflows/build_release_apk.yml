name: Build Release APK (arm64)

# Manual trigger: go to Actions → "Build Release APK (arm64)" → Run workflow
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.18.2)'
        required: true
        default: 'v1.18.2'

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Remove proprietary dependencies (FOSS)
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Add Android NDK target
        run: rustup target add aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages/core -> target packages/localsend_isolates/rust -> target"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app/android
          KEYSTORE_PATH="$(pwd)/app/android/android-keystore.jks"
          echo "$KEYSTORE_BASE64" | base64 -di > "$KEYSTORE_PATH"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PATH" \
            > app/android/key.properties
          echo "--- key.properties (passwords redacted) ---"
          sed 's/Password=.*/Password=<redacted>/' app/android/key.properties
          ls -l "$KEYSTORE_PATH"
          file "$KEYSTORE_PATH"
          echo "--- Verifying keystore with keytool ---"
          keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" 2>&1 || true

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK (arm64-v8a only)
        working-directory: app
        run: flutter build apk --target-platform android-arm64

      - name: Verify APK exists
        working-directory: app
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi
          echo "APK found: $APK_PATH ($(du -h "$APK_PATH" | cut -f1))"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: apk-arm64-v8a-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
