name: Build Release APK (arm64)

# Manual trigger: go to Actions → "Build Release APK (arm64)" → Run workflow
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.18.2)'
        required: true
        default: 'v1.18.2'

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Remove proprietary dependencies (FOSS)
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Add Android NDK target
        run: rustup target add aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages/core -> target packages/localsend_isolates/rust -> target"

      - name: Restore keystore
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          ANDROID_KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          mkdir -p app/android
          echo "$ANDROID_KEY_PROPERTIES" | base64 -di > app/android/key.properties
          echo "$ANDROID_KEY_STORE" | base64 -di > app/android/android-keystore.jks
          # Rewrite storeFile to an absolute path so Gradle always finds it
          # regardless of where key.properties is loaded from.
          sed -i "s|storeFile=.*|storeFile=$(pwd)/app/android/android-keystore.jks|" app/android/key.properties
          echo "--- key.properties (storeFile redacted) ---"
          sed 's|storeFile=.*|storeFile=<absolute-path>|' app/android/key.properties
          ls -l app/android/android-keystore.jks

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK (arm64-v8a only)
        working-directory: app
        run: flutter build apk --target-platform android-arm64

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: apk-arm64-v8a-release
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
